services:
  yimly:
    build:
      context: .
      dockerfile: Dockerfile
    image: yimly:latest
    container_name: yimly
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-yimly_production_secure_secret_change_me}
      - DATA_DIR=/app/data
    volumes:
      # Persistent SQLite database and configuration (never wiped on rebuild)
      - ${DATA_PATH:-./data}:/app/data
      # Host media directory for MP3/LRC files (mounted read-only)
      - ${MEDIA_PATH:-./media}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
